[workspace]
members = [
    "crates/studio-assets",
    "crates/studio-core",
    "crates/studio-project",
    "crates/studio-pipeline",
    "crates/studio-server",
    "crates/studio-cli",
    "crates/studio-toolchain-client",
    "crates/studio-gpu",
    "crates/studio-import",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
schemars = "1"
ts-rs = { version = "11", default-features = false }
futures-util = "0.3"
async-trait = "0.1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["serde"] }
pollster = "0.4"
wgpu = "30.0.1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
tokio-tungstenite = "0.29"
tower-http = { version = "0.6", features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
base64 = "0.22"
percent-encoding = "2"
bincode = { version = "2", features = ["serde"] }
fbx-rs = "0.1.3"
openusd = "0.8.0"
