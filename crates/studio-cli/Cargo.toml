[package]
name = "studio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["fbx", "usd", "step", "ifc", "jt"]
fbx = ["studio-import/fbx"]
ifc = ["studio-import/ifc"]
jt = ["studio-import/jt"]
step = ["studio-import/step"]
usd = ["studio-import/usd"]

[dependencies]
clap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
studio-assets = { path = "../studio-assets" }
studio-core = { path = "../studio-core" }
studio-import = { path = "../studio-import", default-features = false }
studio-project = { path = "../studio-project" }
studio-server = { path = "../studio-server" }
