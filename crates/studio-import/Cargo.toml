[package]
name = "studio-import"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["fbx", "usd", "step", "ifc", "jt"]
fbx = ["dep:fbx-rs"]
ifc = ["dep:ifc-lite-core", "dep:ifc-lite-geometry", "dep:ifc-lite-processing"]
jt = ["dep:command-group"]
step = ["dep:oxideav-step"]
usd = ["dep:openusd"]

[dependencies]
bincode.workspace = true
command-group = { workspace = true, optional = true }
fbx-rs = { workspace = true, optional = true }
glam.workspace = true
ifc-lite-core = { workspace = true, optional = true }
ifc-lite-geometry = { workspace = true, optional = true }
ifc-lite-processing = { workspace = true, optional = true }
openusd = { workspace = true, optional = true }
oxideav-step = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
studio-assets = { path = "../studio-assets" }
tempfile.workspace = true
thiserror.workspace = true
